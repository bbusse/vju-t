name: Build and Release Rust Binaries

on:
  push:
    branches: [dev]
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    uses: bbusse/github-workflows/.github/workflows/build-rust.yml@dev
    with:
      binary_name: vju-t
      artifact_name: vju-t

  build-freebsd:
    uses: bbusse/github-workflows/.github/workflows/build-rust-pkg-freebsd.yml@dev
    with:
      binary_name: vju-t
      artifact_name: vju-t

  release:
    needs:
      - build-macos-arm64
      - build-freebsd
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release-rust.yml@dev
    with:
      artifact_name: vju-t
      binary_name: vju-t
      release_branch: dev
    secrets: inherit

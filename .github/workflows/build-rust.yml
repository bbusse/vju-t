name: Build Rust Binaries

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    uses: bbusse/github-workflows/.github/workflows/build-rust.yml@dev
    with:
      binary_name: vju-t
      artifact_name: vju-t
      musl: true

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: resolve
        run: |
          [[ -f VERSION ]] || echo "v0" > VERSION
          current="$(cat VERSION)"
          short_sha="${GITHUB_SHA::7}"
          if [[ "$current" =~ ^v([0-9]+)-rc([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            echo "version=${major}_pre${GITHUB_RUN_NUMBER}~${short_sha}" >> "$GITHUB_OUTPUT"
          elif [[ "$current" =~ ^v([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            echo "version=${major}~${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognised VERSION format: $current" >&2
            exit 1
          fi

  build-apk:
    needs:
      - build-macos-arm64
      - resolve-version
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: vju-t
      binary_name: vju-t
      version: ${{ needs.resolve-version.outputs.version }}
      pkgurl: https://github.com/bbusse/vju-t
    secrets: inherit
